version: 0.2

phases:
  install:
    runtime_versions:
      nodejs: 20
    commands:
      - echo "Installing Auth service dependencies"
      - cd services/auth && npm ci
  pre_build:
    commands:
      - echo "Logging in to Amazon ECR"
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
      - cd services/auth
      - echo "Running unit tests"
      - npm test
  build:
    commands:
      - echo "Building Auth Docker image"
      - cd ../..
      - docker build -t $ECR_REGISTRY/project6_auth:$CODEBUILD_RESOLVED_SOURCE_VERSION services/auth/
      - docker tag $ECR_REGISTRY/project6_auth:$CODEBUILD_RESOLVED_SOURCE_VERSION $ECR_REGISTRY/project6_auth:latest
      - echo "Pushing Docker image to ECR"
      - docker push $ECR_REGISTRY/project6_auth:$CODEBUILD_RESOLVED_SOURCE_VERSION
      - docker push $ECR_REGISTRY/project6_auth:latest
  post_build:
    commands:
      - echo "Generating deployment artifacts for CodeDeploy"
      - bash deployment/scripts/generate_taskdef.sh auth $CODEBUILD_RESOLVED_SOURCE_VERSION

artifacts:
  files:
    - deployment/task_definitions/auth_taskdef.json
    - deployment/appspec/auth_appspec.yml
