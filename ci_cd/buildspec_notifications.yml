version: 0.2

phases:
  install:
    runtime_versions:
      nodejs: 20
    commands:
      - echo "Installing Notifications service dependencies"
      - cd services/notifications && npm ci
  pre_build:
    commands:
      - echo "Logging in to Amazon ECR"
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
      - cd services/notifications
      - echo "Running unit tests"
      - npm test
  build:
    commands:
      - echo "Building Notifications Docker image"
      - cd ../..
      - docker build -t $ECR_REGISTRY/project6_notifications:$CODEBUILD_RESOLVED_SOURCE_VERSION services/notifications/
      - docker tag $ECR_REGISTRY/project6_notifications:$CODEBUILD_RESOLVED_SOURCE_VERSION $ECR_REGISTRY/project6_notifications:latest
      - echo "Pushing Docker image to ECR"
      - docker push $ECR_REGISTRY/project6_notifications:$CODEBUILD_RESOLVED_SOURCE_VERSION
      - docker push $ECR_REGISTRY/project6_notifications:latest
  post_build:
    commands:
      - echo "Generating deployment artifacts for CodeDeploy"
      - bash deployment/scripts/generate_taskdef.sh notifications $CODEBUILD_RESOLVED_SOURCE_VERSION

artifacts:
  files:
    - deployment/task_definitions/notifications_taskdef.json
    - deployment/appspec/notifications_appspec.yml
